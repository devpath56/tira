# SonarCloud automatic analysis settings.
#
# The demo decks (demo/demo-deck-v*.html) are uploaded snapshots of generated slides:
# every slide repeats one template, and v6 is v5 with two sentences changed. They are left out of
# the analysis altogether (2026-10-25, Isha): main's analysis has failed on every merge since
# Oct 21, when it last passed at 15,550 lines, over the organization's line limit as tira grew
# (by about 5,500 lines since). The decks alone are about 5,800 lines, and aren't code anyone keeps:
# without them tira counts fewer lines than it did when main last passed.
#
# The planted-bug table (scripts/mutants.ts) is one record per line, every row the same shape by
# design ({ name, file, find, replace }). Duplication is compared with the text blanked out, so any run
# of rows reads as a copy of any other, and every planted bug a change adds counted as duplicated new
# code. It is data, not code to factor out: left out of duplication only, and still analysed for bugs
# and code smells like every other file.
sonar.exclusions=demo/*.html
sonar.cpd.exclusions=scripts/mutants.ts
