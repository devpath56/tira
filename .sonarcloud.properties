# SonarCloud automatic analysis settings.
#
# The demo decks (demo/demo-deck-v*.html) are uploaded snapshots of generated slides:
# every slide repeats one template, and v6 is v5 with two sentences changed. That
# repetition isn't code to factor out, so the decks are left out of duplication only.
# They are still analysed for bugs and security like every other file.
sonar.cpd.exclusions=demo/*.html
