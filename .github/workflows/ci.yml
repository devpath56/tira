name: ci

# A push to a PR branch is already covered by pull_request; push only for main,
# so each PR push runs CI once, not twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # Every planted bug must still land exactly once (scripts/mutant-anchors.ts): a moved
      # anchor fails here in seconds, not at the end of the full mutants run below.
      - run: npm run mutants:check
      # Canonical JSON must equal a fresh extraction from the charts (no hand edits).
      - run: node charts/extract-tables.mjs && git diff --exit-code charts/*.json
      - run: npm run check
      # Regions proposal: overlap + guard scans at pack time, in WARN mode first
      # (graduation rule: deny only after the bar proves non-nuisance; the operator signs).
      - name: region-scan (warn mode)
        continue-on-error: true
        run: python3 docs/tools/region-scan.py --all charts/node-lifecycle.json charts/idea-lifecycle.json
      # The factory composition on its own, as signed off (brief's 3 regions, session, drop).
      # The scan is lexical: across compositions, payload names like declared_by / done_test_result
      # read as other tables' state names, so each composition is scanned separately.
      - name: region-scan factory (warn mode)
        continue-on-error: true
        run: python3 docs/tools/region-scan.py --all charts/brief-gate.json charts/brief-claim.json charts/brief-outcome.json charts/session.json charts/drop.json charts/refusal.json charts/override.json
      # Every planted bug must be caught by the suite (scripts/mutants.ts).
      - run: npm run mutants
